<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TGPF Dispatch - Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #417505;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: #417505;
      margin-bottom: 0.75rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 320px;
    }

    .login-form label {
      font-size: 0.85rem;
      color: #555;
      display: block;
      margin-bottom: 0.25rem;
    }

    .login-form input[type="text"],
    .login-form input[type="password"] {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 0.45rem 0.6rem;
      font-size: 0.9rem;
      background: #fff;
    }

    .btn-action {
      background: #417505;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1.3rem;
      font-size: 0.9rem;
      cursor: pointer;
      align-self: flex-start;
    }

    .btn-action:hover { background: #345f04; }

    .error {
      color: #c0392b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>TGPF Dispatch</h1>

  <p class="section-title">Sign in</p>
  <form method="post" action="{% url 'login' %}" class="login-form">
    {% csrf_token %}

    {% if form.errors %}
      <p class="error">Wrong username or password.</p>
    {% endif %}

    <div>
      <label for="{{ form.username.id_for_label }}">Username</label>
      <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
             autocomplete="username" autofocus required>
    </div>

    <div>
      <label for="{{ form.password.id_for_label }}">Password</label>
      <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
             autocomplete="current-password" required>
    </div>

    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn-action">Sign in</button>
  </form>

</body>
</html>
